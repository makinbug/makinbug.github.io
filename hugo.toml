baseURL = "https://makinbug.github.io/"
locale = "en-GB"
title = "Makin'Bug"
theme = "ananke"

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Services"
  pageRef = "/services"
  weight = 20

[[menus.main]]
  name = "Work"
  pageRef = "/work"
  weight = 30

[[menus.main]]
  name = "Made to Order"
  pageRef = "/products"
  weight = 40

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 50

[[menus.main]]
  name = "Contact"
  pageRef = "/contact"
  weight = 60

[params]
  # Stage 5: our own class names, styled in assets/css/custom.css
  body_classes = "mb-body"
  background_color_class = "mb-bar"
  text_color = "mb-text"
  post_content_classes = "mb-prose"

[params.ananke]
  show_recent_posts = false
  # Loads assets/css/custom.css through layouts/_partials/custom-css.html
  custom_css = ["custom-css.html"]
